basePath: /api
definitions:
  serializer.CartJSON:
    properties:
      count:
        type: integer
      id:
        type: integer
    type: object
  serializer.EditSqlQueryItemJSON:
    properties:
      position:
        type: integer
      quantity:
        type: integer
      selectivity:
        type: number
    type: object
  serializer.EditSqlQueryJSON:
    properties:
      query_description:
        type: string
      query_text:
        type: string
      selectivity:
        type: number
      theme:
        type: string
    type: object
  serializer.ErrorResponse:
    properties:
      description:
        type: string
      status:
        type: string
    type: object
  serializer.LoginJSON:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  serializer.LoginResponseJSON:
    properties:
      role:
        type: string
      token:
        type: string
    type: object
  serializer.MessageResponse:
    properties:
      message:
        type: string
    type: object
  serializer.RegisterUserJSON:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  serializer.ServiceJSON:
    properties:
      description:
        example: Compact B-Tree index for fast point lookups and ordered scans.
        type: string
      id:
        example: btree-512mb
        type: string
      image_key:
        example: seed/btree.svg
        type: string
      image_url:
        type: string
      name:
        example: B-Tree (medium table)
        type: string
      short_description_en:
        example: Compact B-Tree index for fast point lookups and ordered scans.
        type: string
      speed:
        example: 0.60ms
        type: string
      table_size:
        example: 512 MB
        type: string
      video_key:
        type: string
      video_url:
        type: string
    type: object
  serializer.SqlQueryDetailsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/serializer.SqlQueryItemJSON'
        type: array
      sql_query:
        $ref: '#/definitions/serializer.SqlQueryJSON'
    type: object
  serializer.SqlQueryItemJSON:
    properties:
      calculated_time_ms:
        type: number
      image_url:
        type: string
      indexed_table_id:
        type: string
      name:
        type: string
      position:
        type: integer
      quantity:
        type: integer
      selectivity:
        type: number
      table_size:
        type: string
      video_url:
        type: string
    type: object
  serializer.SqlQueryJSON:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      created_by_id:
        type: integer
      creator_login:
        type: string
      formed_at:
        type: string
      id:
        type: integer
      moderator_id:
        type: integer
      moderator_login:
        type: string
      query_text:
        type: string
      result_memory:
        type: string
      result_time:
        type: string
      results_count:
        type: integer
      selectivity:
        type: number
      status:
        type: string
      theme:
        type: string
    type: object
  serializer.StatusJSON:
    properties:
      status:
        type: string
    type: object
  serializer.UserJSON:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
host: localhost:8082
info:
  contact: {}
  description: 'API лабораторной: JWT, роли, Redis blacklist, заявки sql_query, каталог
    indexed-tables (в JSON поле short_description_en — короткий англ. текст).'
  title: SQL Index Simulator API
  version: "1.0"
paths:
  /cart:
    get:
      description: Always returns HTTP 200 for the SPA cart icon without JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.CartJSON'
      summary: Public cart badge (no auth)
      tags:
      - cart
  /indexed-tables:
    get:
      description: Public catalog; optional substring filter on name and table_size.
      parameters:
      - description: Case-insensitive filter on name or table_size
        in: query
        name: filter
        type: string
      - description: Alias of filter (legacy sample param)
        in: query
        name: Title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/serializer.ServiceJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      summary: List indexed tables
      tags:
      - indexed-tables
    post:
      consumes:
      - multipart/form-data
      - application/json
      parameters:
      - description: Stable service id (slug)
        in: formData
        name: id
        required: true
        type: string
      - description: Display name
        in: formData
        name: name
        required: true
        type: string
      - description: Table + index size label
        in: formData
        name: table_size
        required: true
        type: string
      - description: Latency label
        in: formData
        name: speed
        type: string
      - description: Full English description
        in: formData
        name: description
        type: string
      - description: Short English blurb (~50–100 chars) for SPA multimodal search
        in: formData
        name: short_description_en
        type: string
      - description: Card image
        in: formData
        name: image
        type: file
      - description: Preview GIF/video
        in: formData
        name: video
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/serializer.ServiceJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create indexed table (moderator)
      tags:
      - indexed-tables
  /indexed-tables/{id}:
    get:
      parameters:
      - description: Service id (slug)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.ServiceJSON'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      summary: Get indexed table by ID
      tags:
      - indexed-tables
  /sql-queries:
    get:
      description: Creators see their own rows; moderators see all.
      parameters:
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Formed-from date YYYY-MM-DD
        in: query
        name: formed-from
        type: string
      - description: Formed-to date YYYY-MM-DD
        in: query
        name: formed-to
        type: string
      - description: Legacy alias of formed-from
        in: query
        name: from-date
        type: string
      - description: Legacy alias of formed-to
        in: query
        name: to-date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/serializer.SqlQueryJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List sql queries
      tags:
      - sql-queries
  /sql-queries/{id}:
    delete:
      parameters:
      - description: Sql query id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete sql query draft
      tags:
      - sql-queries
    get:
      parameters:
      - description: Sql query id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.SqlQueryDetailsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get one sql query
      tags:
      - sql-queries
    put:
      consumes:
      - application/json
      parameters:
      - description: Sql query id
        in: path
        name: id
        required: true
        type: integer
      - description: Editable fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/serializer.EditSqlQueryJSON'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.SqlQueryJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update sql query fields
      tags:
      - sql-queries
  /sql-queries/{id}/finish:
    put:
      consumes:
      - application/json
      parameters:
      - description: Sql query id
        in: path
        name: id
        required: true
        type: integer
      - description: 'New status: completed or rejected'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/serializer.StatusJSON'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.SqlQueryJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Finish or reject sql query (moderator)
      tags:
      - sql-queries
  /sql-queries/{id}/form:
    put:
      parameters:
      - description: Sql query id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.SqlQueryJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Form (submit) sql query
      tags:
      - sql-queries
  /sql-queries/{id}/indexed-tables/{indexed_table_id}:
    delete:
      parameters:
      - description: Sql query id
        in: path
        name: id
        required: true
        type: integer
      - description: Indexed table id (slug)
        in: path
        name: indexed_table_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Remove line item from sql query
      tags:
      - sql-query-items
    put:
      consumes:
      - application/json
      parameters:
      - description: Sql query id
        in: path
        name: id
        required: true
        type: integer
      - description: Indexed table id (slug)
        in: path
        name: indexed_table_id
        required: true
        type: string
      - description: Line item fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/serializer.EditSqlQueryItemJSON'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.SqlQueryItemJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Edit line item in sql query
      tags:
      - sql-query-items
  /sql-queries/cart:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.CartJSON'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Authenticated user cart badge
      tags:
      - sql-queries
  /sql-queries/draft/indexed-tables/{indexed_table_id}:
    post:
      parameters:
      - description: Indexed table id (slug)
        in: path
        name: indexed_table_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/serializer.SqlQueryItemJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Add indexed table to draft sql query
      tags:
      - sql-query-items
  /users/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/serializer.LoginJSON'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serializer.LoginResponseJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      summary: Login (JWT)
      tags:
      - users
  /users/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout (blacklist token)
      tags:
      - users
  /users/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/serializer.RegisterUserJSON'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/serializer.UserJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serializer.ErrorResponse'
      summary: Register user
      tags:
      - users
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
