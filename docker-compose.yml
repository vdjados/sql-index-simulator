version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: rip-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rootminio
      MINIO_ROOT_PASSWORD: rootminio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: rip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: rip-redis
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASS:-password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: rip-adminer
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  redis-data: