<html lang="ru">
    <head>
        <title>{{ .service.Name }} — Детали индекса</title>
        <link rel="stylesheet" href="/static/styles/index_style.css">
    </head>
    <body>
        <header class="header-secondary">
            <a href="/" class="header-logo">
                <img src="http://localhost:9000/sql-index/logo.png" alt="SQL Index Simulator">
                <span class="header-title">SQL Index Simulator</span>
            </a>
        </header>
        <div class="detail-wrapper">
            <div class="detail-card">
                <div class="detail-card__gif-wrap">
                    <img
                        src="http://localhost:9000/sql-index/{{ .service.GifKey }}"
                        alt="{{ .service.Name }}"
                        class="detail-card__gif"
                    >
                </div>
                <div class="detail-card__body">
                    <h1 class="detail-card__title">{{ .service.Name }}</h1>
                    <div class="detail-card__badges">
                        <span class="detail-card__badge detail-card__badge--table">Таблица: {{ .service.TableSize }}</span>
                        <span class="detail-card__badge detail-card__badge--speed">Скорость: {{ .service.Speed }}</span>
                    </div>
                    <p class="detail-card__description">{{ .service.Description }}</p>
                    <form method="POST" action="/sql_query/add" class="detail-card__form">
                        <input type="hidden" name="service_id" value="{{ .service.ID }}">
                        <button type="submit" class="search-btn">Добавить в запрос</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
