<html lang="ru">
    <head>
        <title>SQL Index Simulator — Индексы</title>
        <link rel="stylesheet" href="/static/styles/index_style.css">
    </head>
    <body>
        <header class="header-main">
            <a href="/" class="header-logo">
                <img src="http://localhost:9000/sql-index/logo.png" alt="SQL Index Simulator">
                <span class="header-title">SQL Index Simulator</span>
            </a>
        </header>

        <main class="page">
            <section class="search-section">
                <form action="/" method="GET" class="search-form">
                    <input
                        type="text"
                        name="filter"
                        class="search-input"
                        placeholder="Поиск по названию индекса или размеру таблицы"
                        value="{{ .filter }}"
                    >
                    <button type="submit" class="search-btn">Найти</button>
                </form>
                {{ if .request }}
                <a href="/sql_query/{{ .request.ID }}" class="cart-icon" aria-label="Корзина">
                    <span class="cart-icon-symbol">🧺</span>
                    <span class="cart-badge">{{ .cartCount }}</span>
                </a>
                {{ else }}
                <span class="cart-icon cart-icon--empty" aria-label="Корзина пуста">
                    <span class="cart-icon-symbol">🧺</span>
                    <span class="cart-badge cart-badge--empty">0</span>
                </span>
                {{ end }}
            </section>
            <section class="cards-grid">
                {{ range .services }}
                <div class="service-card">
                    <a href="/service/{{ .ID }}">
                        <div class="card-image-wrapper">
                            <img
                                src="http://localhost:9000/sql-index/{{ .ImageKey }}"
                                alt="{{ .Name }}"
                                class="service-card-image"
                            >
                        </div>
                    </a>
                    <div class="service-card-body">
                        <h1 class="service-card-title">{{ .Name }}</h1>
                        <div class="service-metrics">
                            <span class="service-metric-pill">Таблица + Индекс: {{ .TableSize }}</span>
                        </div>
                        <form action="/sql_query/add" method="POST" class="service-add-form">
                            <input type="hidden" name="service_id" value="{{ .ID }}">
                            <button type="submit" class="search-btn">Добавить в запрос</button>
                        </form>
                    </div>
                </div>
                {{ end }}
            </section>
        </main>
    </body>
</html>
